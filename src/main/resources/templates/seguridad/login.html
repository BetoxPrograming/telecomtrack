<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 text-center mb-4"
                        th:text="#{seguridad.login.titulo}">
                    </h1>

                    <div th:if="${param.error}"
                         class="alert alert-danger"
                         th:text="#{seguridad.login.error}">
                    </div>

                    <div th:if="${param.logout}"
                         class="alert alert-success"
                         th:text="#{seguridad.login.logout}">
                    </div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">

                            <label for="username"
                                   class="form-label"
                                   th:text="#{campo.correo}">
                            </label>

                            <input type="email"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   required
                                   autofocus
                                   autocomplete="username">

                        </div>

                        <div class="mb-3">

                            <label for="password"
                                   class="form-label"
                                   th:text="#{campo.password}">
                            </label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   required
                                   autocomplete="current-password">

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100"
                                th:text="#{seguridad.accion.ingresar}">
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

<div th:replace="~{general/fragmentos :: scripts}"></div>

</body>
</html>
