<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{plantilla.titulo}"></title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet">
</head>

<header th:fragment="header" class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center gap-2 flex-wrap">
        <a th:href="@{/}" class="text-white text-decoration-none">TelecomTrack</a>

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <a th:href="@{/herramienta/catalogo}" class="btn btn-outline-light btn-sm">
                <span th:text="#{herramienta.titulo.catalogo}"></span>
            </a>

            <a sec:authorize="hasRole('Administrador')"
               th:href="@{/notificacion/configuracion}"
               class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-envelope"></i>
                <span th:text="#{notificacion.accion.menu}"></span>
            </a>

            <a sec:authorize="hasRole('Bodeguero')"
               th:href="@{/inventario/importar}"
               class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-file-import"></i>
                <span th:text="#{importacion.accion.menu}"></span>
            </a>

            <a sec:authorize="hasRole('Bodeguero')"
               th:href="@{/dashboard}"
               class="btn btn-outline-light btn-sm">
                <span th:text="#{dashboard.titulo}"></span>
            </a>

            <a sec:authorize="hasRole('Supervisor')"
               th:href="@{/dashboard/supervisor}"
               class="btn btn-outline-light btn-sm">
                <span th:text="#{dashboard.supervisor.titulo}"></span>
            </a>
        </div>

        <div class="d-flex align-items-center gap-2">

            <div class="dropdown" th:with="rutaIdioma=${idiomaRuta != null ? idiomaRuta : '/'}">
                <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Idioma
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="${rutaIdioma} + '?lang=es'">Español</a></li>
                    <li><a class="dropdown-item" th:href="${rutaIdioma} + '?lang=en'">English</a></li>
                    <li><a class="dropdown-item" th:href="${rutaIdioma} + '?lang=ja'">日本語</a></li>
                    <li><a class="dropdown-item" th:href="${rutaIdioma} + '?lang=zh'">中文</a></li>
                </ul>
            </div>

            <a sec:authorize="isAnonymous()"
               th:href="@{/login}"
               class="btn btn-primary btn-sm">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span th:text="#{seguridad.accion.ingresar}"></span>
            </a>

            <div sec:authorize="isAuthenticated()"
                 class="d-flex align-items-center gap-2">

                <span class="small"
                      sec:authentication="name"></span>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit"
                            class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span th:text="#{seguridad.accion.salir}"></span>
                    </button>
                </form>
            </div>

        </div>
    </div>
</header>

<footer th:fragment="footer"></footer>

<div th:fragment="scripts">
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/rutinas.js}"></script>
</div>

<div th:fragment="confirmarDesactivarUsuario">
    <div class="modal fade" id="modalDesactivarUsuario" tabindex="-1" aria-labelledby="modalDesactivarUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDesactivarUsuarioLabel" th:text="#{usuario.confirmacion.desactivar.titulo}"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{accion.cerrar}"></button>
                </div>

                <div class="modal-body">
                    <span th:text="#{usuario.confirmacion.desactivar.mensaje}"></span>
                    <strong id="modalDescripcion"></strong>?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{accion.cancelar}"></button>

                    <form th:action="@{/usuario/desactivar}" method="post">
                        <input type="hidden" id="modalId" name="idUsuario">
                        <button type="submit" class="btn btn-danger" th:text="#{accion.desactivar}"></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
