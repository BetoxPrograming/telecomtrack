<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <h2 class="fw-bold mb-4">
        <i class="fa-solid fa-clipboard-check text-primary me-2"></i>
        <span th:text="#{solicitud.titulo.pendientes}">Solicitudes pendientes</span>
    </h2>

    <div th:if="${exitoo}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${exitoo}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(pendientes)}" class="text-center py-5 text-muted">
                <i class="fa-solid fa-inbox fa-3x mb-3 d-block"></i>
                <span th:text="#{solicitud.mensaje.sinPendientes}">No hay solicitudes pendientes.</span>
            </div>
            <div class="table-responsive" th:if="${not #lists.isEmpty(pendientes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{asignacion.tecnico}">Tecnico</th>
                        <th th:text="#{asignacion.proyecto}">Proyecto</th>
                        <th th:text="#{campo.ubicacion}">Bodega</th>
                        <th th:text="#{solicitud.campo.fecha}">Fecha</th>
                        <th th:text="#{campo.acciones}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${pendientes}">
                        <td th:text="${s.tecnico.nombre + ' ' + s.tecnico.apellido}"></td>
                        <td th:text="${s.proyecto.nombre}"></td>
                        <td th:text="${s.ubicacion.nombre}"></td>
                        <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-nowrap">
                            <a th:href="@{/solicitud/consultar/{id}(id=${s.idSolicitud})}"
                               class="btn btn-sm btn-info" th:text="#{accion.consultar}">Ver</a>

                            <form th:action="@{/solicitud/aprobar/{id}(id=${s.idSolicitud})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success"
                                        th:text="#{solicitud.accion.aprobar}">Aprobar</button>
                            </form>

                            <a th:href="@{/solicitud/rechazar/{id}(id=${s.idSolicitud})}"
                               class="btn btn-sm btn-danger"
                               th:text="#{solicitud.accion.rechazar}">Rechazar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
