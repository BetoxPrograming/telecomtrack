<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="fa-solid fa-user-gear text-primary me-2"></i>
            <span th:text="#{solicitud.titulo.misSolicitudes}">Mis solicitudes</span>
        </h2>
        <a th:href="@{/solicitud/nueva}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i>
            <span th:text="#{solicitud.accion.nueva}">Nueva solicitud</span>
        </a>
    </div>

    <div th:if="${exitoo}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${exitoo}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/solicitud/mis-solicitudes}" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{asignacion.tecnico}">Tecnico</label>
                    <select name="tecnicoId" class="form-select" onchange="this.form.submit()">
                        <option value="" th:text="#{rol.seleccionar}">-- Seleccione --</option>
                        <option th:each="t : ${tecnicos}"
                                th:value="${t.idUsuario}"
                                th:text="${t.nombre + ' ' + t.apellido}"
                                th:selected="${tecnicoId != null and tecnicoId == t.idUsuario}">
                        </option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0" th:if="${tecnicoId != null}">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(solicitudes)}" class="text-center py-5 text-muted">
                <i class="fa-solid fa-inbox fa-3x mb-3 d-block"></i>
                <span th:text="#{solicitud.mensaje.sinRegistros}">No tiene solicitudes registradas.</span>
            </div>
            <div class="table-responsive" th:if="${not #lists.isEmpty(solicitudes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{asignacion.proyecto}">Proyecto</th>
                        <th th:text="#{campo.ubicacion}">Bodega</th>
                        <th th:text="#{solicitud.campo.fecha}">Fecha</th>
                        <th th:text="#{campo.estado}">Estado</th>
                        <th th:text="#{campo.acciones}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${solicitudes}">
                        <td th:text="${s.proyecto.nombre}"></td>
                        <td th:text="${s.ubicacion.nombre}"></td>
                        <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:switch="${s.estado}">
                                <span th:case="'PENDIENTE'" class="badge bg-warning text-dark" th:text="#{solicitud.estado.pendiente}"></span>
                                <span th:case="'APROBADA'" class="badge bg-success" th:text="#{solicitud.estado.aprobada}"></span>
                                <span th:case="'RECHAZADA'" class="badge bg-danger" th:text="#{solicitud.estado.rechazada}"></span>
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/solicitud/consultar/{id}(id=${s.idSolicitud})}"
                               class="btn btn-sm btn-info" th:text="#{accion.consultar}">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
