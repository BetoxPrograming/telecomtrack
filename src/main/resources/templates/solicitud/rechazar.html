<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-danger text-white">
                    <i class="fa-solid fa-ban me-2"></i>
                    <span th:text="#{solicitud.accion.rechazar}">Rechazar solicitud</span>
                </div>
                <div class="card-body">

                    <p>
                        <strong th:text="#{asignacion.tecnico}">Tecnico</strong>:
                        <span th:text="${solicitud.tecnico.nombre + ' ' + solicitud.tecnico.apellido}"></span>
                        &mdash;
                        <strong th:text="#{asignacion.proyecto}">Proyecto</strong>:
                        <span th:text="${solicitud.proyecto.nombre}"></span>
                    </p>

                    <form th:action="@{/solicitud/rechazar/{id}(id=${solicitud.idSolicitud})}" method="post">


                        <div class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{solicitud.campo.motivoRechazo}">Motivo</label>
                            <textarea name="motivo" class="form-control" rows="3" required></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/solicitud/pendientes}"
                               class="btn btn-outline-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                            <button type="submit" class="btn btn-danger" th:text="#{solicitud.accion.rechazar}">Rechazar</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
