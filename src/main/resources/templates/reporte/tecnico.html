<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="fa-solid fa-user-gear text-primary me-2"></i>
            <span th:text="#{reporte.tecnico.titulo}">Assets by technician</span>
        </h2>
        <a th:href="@{/reportes}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>
            <span th:text="#{accion.regresar}">Back</span>
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/reportes/tecnico}" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-semibold" th:text="#{reporte.filtro.tecnico}">Technician</label>
                    <select name="tecnicoId" class="form-select">
                        <option value="" th:text="#{reporte.filtro.todos}">-- All --</option>
                        <option th:each="t : ${tecnicos}"
                                th:value="${t.idUsuario}"
                                th:text="${t.nombre + ' ' + t.apellido}"
                                th:selected="${tecnicoId != null and tecnicoId == t.idUsuario}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" th:text="#{reporte.filtro.proyecto}">Project</label>
                    <select name="proyectoId" class="form-select">
                        <option value="" th:text="#{reporte.filtro.todos}">-- All --</option>
                        <option th:each="p : ${proyectos}"
                                th:value="${p.idProyecto}"
                                th:text="${p.nombre}"
                                th:selected="${proyectoId != null and proyectoId == p.idProyecto}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" th:text="#{reporte.filtro.estado}">Status</label>
                    <select name="estado" class="form-select">
                        <option value="" th:text="#{reporte.filtro.todos}">-- All --</option>
                        <option value="ACTIVA" th:selected="${estado == 'ACTIVA'}" th:text="#{reporte.tecnico.estado.activa}">Active</option>
                        <option value="DEVUELTA" th:selected="${estado == 'DEVUELTA'}" th:text="#{reporte.tecnico.estado.devuelta}">Returned</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-filter me-1"></i>
                        <span th:text="#{reporte.filtro.aplicar}">Apply filters</span>
                    </button>
                </div>
                <div class="col-12 d-flex gap-2">
                    <a class="btn btn-outline-success"
                       th:href="@{/reportes/tecnico/exportar/excel(tecnicoId=${tecnicoId},proyectoId=${proyectoId},estado=${estado})}">
                        <i class="fa-solid fa-file-excel me-1"></i>
                        <span th:text="#{reporte.accion.exportarExcel}">Export to Excel</span>
                    </a>
                    <a class="btn btn-outline-danger"
                       th:href="@{/reportes/tecnico/exportar/pdf(tecnicoId=${tecnicoId},proyectoId=${proyectoId},estado=${estado})}">
                        <i class="fa-solid fa-file-pdf me-1"></i>
                        <span th:text="#{reporte.accion.exportarPdf}">Export to PDF</span>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(filas)}" class="text-center py-5 text-muted">
                <span th:text="#{reporte.tecnico.vacio}">No assignments match the selected filters.</span>
            </div>
            <div class="table-responsive" th:if="${not #lists.isEmpty(filas)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{reporte.tecnico.col.tecnico}">Technician</th>
                        <th th:text="#{reporte.tecnico.col.herramienta}">Tool</th>
                        <th th:text="#{reporte.tecnico.col.proyecto}">Project</th>
                        <th th:text="#{reporte.tecnico.col.fecha}">Assignment date</th>
                        <th th:text="#{reporte.tecnico.col.estado}">Current status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fila : ${filas}">
                        <td th:text="${fila.tecnico.nombre + ' ' + fila.tecnico.apellido}"></td>
                        <td th:text="${fila.herramientaCodigo + ' - ' + fila.herramientaNombre}"></td>
                        <td th:text="${fila.proyecto.nombre}"></td>
                        <td th:text="${#temporals.format(fila.fechaAsignacion, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:if="${fila.estadoActual == 'ACTIVA'}" class="badge bg-success" th:text="#{reporte.tecnico.estado.activa}">Active</span>
                            <span th:if="${fila.estadoActual == 'DEVUELTA'}" class="badge bg-secondary" th:text="#{reporte.tecnico.estado.devuelta}">Returned</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
