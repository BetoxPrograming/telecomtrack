<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="fa-solid fa-file-lines text-primary me-2"></i>
            <span th:text="#{reporte.menu.titulo}">Reportes</span>
        </h2>
        <a th:href="@{/dashboard}" class="btn btn-outline-primary">
            <i class="fa-solid fa-gauge-high me-1"></i>
            <span th:text="#{dashboard.titulo}">Dashboard</span>
        </a>
    </div>

    <p class="text-muted mb-4" th:text="#{reporte.menu.descripcion}">Choose a report to generate.</p>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="#{reporte.consumoProyecto.titulo}">Consumption by project</h2>
                    <p class="card-text text-muted small" th:text="#{reporte.consumoProyecto.descripcion}"></p>
                    <a th:href="@{/reportes/consumo-proyecto}" class="btn btn-primary mt-auto"
                       th:text="#{accion.consultar}">View</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="#{reporte.inventario.titulo}">General inventory report</h2>
                    <p class="card-text text-muted small" th:text="#{reporte.inventario.descripcion}"></p>
                    <a th:href="@{/reportes/inventario}" class="btn btn-primary mt-auto"
                       th:text="#{accion.consultar}">View</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="#{reporte.tecnico.titulo}">Assets by technician</h2>
                    <p class="card-text text-muted small" th:text="#{reporte.tecnico.descripcion}"></p>
                    <a th:href="@{/reportes/tecnico}" class="btn btn-primary mt-auto"
                       th:text="#{accion.consultar}">View</a>
                </div>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
