<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="fa-solid fa-chart-column text-primary me-2"></i>
            <span th:text="#{reporte.consumoProyecto.titulo}">Consumption by project</span>
        </h2>
        <a th:href="@{/reportes}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>
            <span th:text="#{accion.regresar}">Back</span>
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/reportes/consumo-proyecto}" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{reporte.filtro.proyecto}">Project</label>
                    <select name="proyectoId" class="form-select" onchange="this.form.submit()">
                        <option value="" th:text="#{reporte.filtro.todos}">-- All --</option>
                        <option th:each="p : ${proyectos}"
                                th:value="${p.idProyecto}"
                                th:text="${p.nombre}"
                                th:selected="${proyectoId != null and proyectoId == p.idProyecto}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6 d-flex gap-2">
                    <a class="btn btn-outline-success"
                       th:href="@{/reportes/consumo-proyecto/exportar/excel(proyectoId=${proyectoId})}">
                        <i class="fa-solid fa-file-excel me-1"></i>
                        <span th:text="#{reporte.accion.exportarExcel}">Export to Excel</span>
                    </a>
                    <a class="btn btn-outline-danger"
                       th:href="@{/reportes/consumo-proyecto/exportar/pdf(proyectoId=${proyectoId})}">
                        <i class="fa-solid fa-file-pdf me-1"></i>
                        <span th:text="#{reporte.accion.exportarPdf}">Export to PDF</span>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(filas)}" class="text-center py-5 text-muted">
                <span th:text="#{reporte.consumoProyecto.vacio}">Select a project to see its consumption.</span>
            </div>
            <div class="table-responsive" th:if="${not #lists.isEmpty(filas)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{reporte.consumoProyecto.col.proyecto}">Project</th>
                        <th class="text-center" th:text="#{reporte.consumoProyecto.col.estimado}">Estimated</th>
                        <th class="text-center" th:text="#{reporte.consumoProyecto.col.real}">Real</th>
                        <th class="text-center" th:text="#{reporte.consumoProyecto.col.diferencia}">Difference</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fila : ${filas}">
                        <td th:text="${fila.proyecto.nombre}"></td>
                        <td class="text-center" th:text="${fila.cantidadEstimada}"></td>
                        <td class="text-center" th:text="${fila.cantidadReal}"></td>
                        <td class="text-center">
                            <span th:text="${fila.diferencia}"
                                  th:class="${fila.diferencia > 0} ? 'badge bg-danger' : 'badge bg-success'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
