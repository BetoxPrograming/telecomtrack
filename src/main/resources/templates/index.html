<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">

    <section class="row justify-content-center mb-4">
        <div class="col-lg-10 text-center">
            <h1 class="display-5 fw-bold" th:text="#{inicio.titulo}"></h1>
            <p class="lead text-muted mb-0" th:text="#{inicio.subtitulo}"></p>
        </div>
    </section>

    <section class="row g-4">

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{usuario.titulo.listado}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.usuarios.descripcion}"></p>
                    <a th:href="@{/usuario/listado}"
                       class="btn btn-primary mt-auto"
                       th:text="#{usuario.accion.agregar}"></a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{ubicacion.titulo.listado}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.ubicaciones.descripcion}"></p>
                    <a th:href="@{/ubicacion/listado}"
                       class="btn btn-primary mt-auto"
                       th:text="#{ubicacion.accion.agregar}"></a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{herramienta.titulo.catalogo}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.herramientas.descripcion}"></p>
                    <a th:href="@{/herramienta/catalogo}"
                       class="btn btn-primary mt-auto"
                       th:text="#{herramienta.titulo.catalogo}"></a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{proyecto.titulo.listado}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.proyectos.descripcion}"></p>
                    <a th:href="@{/proyecto/listado}"
                       class="btn btn-primary mt-auto"
                       th:text="#{accion.consultar}"></a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{solicitud.titulo.listado}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.solicitudes.descripcion}"></p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/solicitud/nueva}"
                           class="btn btn-primary"
                           th:text="#{solicitud.accion.nueva}"></a>
                        <a th:href="@{/solicitud/pendientes}"
                           class="btn btn-outline-primary"
                           th:text="#{solicitud.titulo.pendientes}"></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{listadoMaterialEstimado.titulo.listado}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.listadoMaterialEstimado.descripcion}"></p>
                    <a th:href="@{/listado-material-estimado/pendientes}"
                       class="btn btn-primary mt-auto"
                       th:text="#{listadoMaterialEstimado.titulo.pendientes}"></a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4 card-title" th:text="#{dashboard.titulo}"></h2>
                    <p class="card-text text-muted" th:text="#{inicio.dashboard.descripcion}"></p>
                    <div class="mt-auto d-flex gap-2">
                        <a th:href="@{/dashboard}"
                           class="btn btn-primary"
                           th:text="#{dashboard.titulo}"></a>
                        <a th:href="@{/reportes}"
                           class="btn btn-outline-primary"
                           th:text="#{reporte.menu.titulo}"></a>
                    </div>
                </div>
            </div>
        </div>

    </section>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

<div th:replace="~{general/fragmentos :: scripts}"></div>

</body>
</html>
