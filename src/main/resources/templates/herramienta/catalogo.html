<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">

    <div th:replace="~{herramienta/fragmentos :: alerta}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 th:text="#{herramienta.titulo.catalogo}"></h1>

    </div>

    <div class="table-responsive">

        <table class="table table-striped table-hover align-middle">

            <thead>
            <tr>
                <th th:text="#{campo.codigo}"></th>
                <th th:text="#{campo.nombre}"></th>
                <th th:text="#{campo.descripcion}"></th>
                <th th:text="#{campo.estado}"></th>
                <th th:text="#{campo.detalles}"></th>
                <th th:text="#{campo.acciones}"></th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="herramienta : ${herramientas}">

                <td th:text="${herramienta.codigo}"></td>
                <td th:text="${herramienta.nombre}"></td>
                <td th:text="${herramienta.descripcion}"></td>
                <td th:text="${herramienta.estado}"></td>

                <td>
                    <div th:if="${herramienta.fechaRetornoEstimada != null}">
                        <strong th:text="#{campo.fecha.retorno.estimada}"></strong>:
                        <span th:text="${herramienta.fechaRetornoEstimada}"></span>
                    </div>

                    <div th:if="${herramienta.fechaBajaDefinitiva != null}">
                        <strong th:text="#{campo.fecha.baja.definitiva}"></strong>:
                        <span th:text="${herramienta.fechaBajaDefinitiva}"></span>
                        <br>
                        <small class="text-muted"
                               th:text="${herramienta.justificacionBajaDefinitiva}"></small>
                    </div>

                    <span th:if="${herramienta.fechaRetornoEstimada == null and herramienta.fechaBajaDefinitiva == null}"
                          th:text="'-'"></span>
                </td>

                <td>

                    <a th:href="@{/herramienta/consultar/{idHerramienta}(idHerramienta=${herramienta.idHerramienta})}"
                       class="btn btn-info btn-sm"
                       th:text="#{accion.consultar}"></a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(herramientas)}">

                <td colspan="6"
                    class="text-center"
                    th:text="#{herramienta.mensaje.sin-registros}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

<div th:replace="~{general/fragmentos :: scripts}"></div>

</body>
</html>
