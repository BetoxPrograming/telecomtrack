<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>
<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">
    <div th:replace="~{herramienta/fragmentos :: toast}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{herramienta.titulo.listado}"></h1>
        <a th:href="@{/herramienta/nuevo}" class="btn btn-primary" th:text="#{herramienta.accion.agregar}"></a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th th:text="#{campo.codigo}"></th>
                <th th:text="#{campo.nombre}"></th>
                <th th:text="#{campo.categoria}"></th>
                <th th:text="#{campo.descripcion}"></th>
                <th th:text="#{herramienta.campo.valorUnitario}"></th>
                <th th:text="#{campo.estado}"></th>
                <th th:text="#{campo.detalles}"></th>
                <th th:text="#{campo.acciones}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="herramienta : ${herramientas}">
                <td th:text="${herramienta.codigo}"></td>
                <td th:text="${herramienta.nombre}"></td>
                <td th:text="${herramienta.categoria}"></td>
                <td th:text="${herramienta.descripcion}"></td>
                <td th:text="${#numbers.formatDecimal(herramienta.valorUnitario, 1, 2)}"></td>
                <td>
                    <span th:replace="~{herramienta/fragmentos :: estadoTexto(estado=${herramienta.estado})}"></span>
                </td>
                <td>
                    <div th:if="${herramienta.fechaRetornoEstimada != null}">
                        <strong th:text="#{campo.fecha.retorno.estimada}"></strong>:
                        <span th:text="${herramienta.fechaRetornoEstimada}"></span>
                    </div>
                    <div th:if="${herramienta.fechaBaja != null}">
                        <strong th:text="#{campo.fecha.baja}"></strong>:
                        <span th:text="${herramienta.fechaBaja}"></span>
                        <br>
                        <small class="text-muted" th:text="${herramienta.justificacionBaja}"></small>
                    </div>
                    <span th:if="${herramienta.fechaRetornoEstimada == null and herramienta.fechaBaja == null}">-</span>
                </td>
                <td>
                    <a th:href="@{/herramienta/consultar/{idHerramienta}(idHerramienta=${herramienta.idHerramienta})}" class="btn btn-info btn-sm" th:text="#{accion.consultar}"></a>
                    <a th:href="@{/qr/herramienta/{idHerramienta}/ficha(idHerramienta=${herramienta.idHerramienta})}" class="btn btn-outline-primary btn-sm" th:text="#{qr.accion.ver}"></a>
                    <a th:href="@{/herramienta/modificar/{idHerramienta}(idHerramienta=${herramienta.idHerramienta})}" class="btn btn-warning btn-sm" th:text="#{accion.modificar}"></a>
                    <a th:if="${herramienta.estado != 'Baja'}" th:href="@{/herramienta/baja/{idHerramienta}(idHerramienta=${herramienta.idHerramienta})}" class="btn btn-danger btn-sm" th:text="#{herramienta.accion.baja}"></a>
                    <a th:if="${herramienta.estado == 'Disponible'}" th:href="@{/herramienta/mantenimiento/{idHerramienta}(idHerramienta=${herramienta.idHerramienta})}" class="btn btn-secondary btn-sm" th:text="#{herramienta.accion.mantenimiento}"></a>
                    <form th:if="${herramienta.estado == 'Mantenimiento'}" th:action="@{/herramienta/disponible}" method="post" class="d-inline">
                        <input type="hidden" name="idHerramienta" th:value="${herramienta.idHerramienta}">
                        <button type="submit" class="btn btn-success btn-sm" th:text="#{herramienta.accion.disponible}"></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(herramientas)}">
                <td colspan="8" class="text-center" th:text="#{herramienta.mensaje.sin-registros}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
