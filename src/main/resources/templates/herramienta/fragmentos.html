<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<div th:fragment="alerta">
    <div th:if="${mensaje != null}"
         class="alert"
         th:classappend="${tipoMensaje == 'success'} ? ' alert-success' : ' alert-info'"
         role="alert"
         th:text="${mensaje}"></div>
</div>

<div th:fragment="fichaHerramienta(herramienta)">
    <div class="card mb-4">
        <div class="card-body">
            <div class="mb-2">
                <strong><span th:text="#{campo.codigo}"></span>:</strong>
                <span th:text="${herramienta.codigo}"></span>
            </div>
            <div class="mb-2">
                <strong><span th:text="#{campo.nombre}"></span>:</strong>
                <span th:text="${herramienta.nombre}"></span>
            </div>
            <div class="mb-2" th:if="${herramienta.descripcion != null and !#strings.isEmpty(herramienta.descripcion)}">
                <strong><span th:text="#{campo.descripcion}"></span>:</strong>
                <span th:text="${herramienta.descripcion}"></span>
            </div>
            <div class="mb-2">
                <strong><span th:text="#{campo.estado}"></span>:</strong>
                <span th:text="${herramienta.estado}"></span>
            </div>
            <div class="mb-2" th:if="${herramienta.fechaRetornoEstimada != null}">
                <strong><span th:text="#{campo.fecha.retorno.estimada}"></span>:</strong>
                <span th:text="${herramienta.fechaRetornoEstimada}"></span>
            </div>
            <div class="mb-2" th:if="${herramienta.fechaBajaDefinitiva != null}">
                <strong><span th:text="#{campo.fecha.baja.definitiva}"></span>:</strong>
                <span th:text="${herramienta.fechaBajaDefinitiva}"></span>
                <br>
                <small class="text-muted"
                       th:text="${herramienta.justificacionBajaDefinitiva}"></small>
            </div>
        </div>
    </div>
</div>

</html>
