<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
                <div>
                    <h1 class="mb-1" th:text="#{importacion.titulo}"></h1>
                    <p class="text-muted mb-0" th:text="#{importacion.descripcion}"></p>
                </div>
                <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{accion.regresar}"></a>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form th:action="@{/inventario/importar/procesar}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label for="tipo" class="form-label" th:text="#{importacion.campo.tipo}"></label>
                            <select id="tipo" name="tipo" class="form-select" required>
                                <option value="" th:text="#{importacion.tipo.seleccionar}"></option>
                                <option th:value="${tipoHerramienta}"
                                        th:selected="${tipoSeleccionado == tipoHerramienta}"
                                        th:text="#{importacion.tipo.herramienta}"></option>
                                <option th:value="${tipoMaterial}"
                                        th:selected="${tipoSeleccionado == tipoMaterial}"
                                        th:text="#{importacion.tipo.material}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="archivo" class="form-label" th:text="#{importacion.campo.archivo}"></label>
                            <input id="archivo"
                                   name="archivo"
                                   type="file"
                                   class="form-control"
                                   accept=".csv,text/csv"
                                   required>
                            <div class="form-text" th:text="#{importacion.archivo.ayuda}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-file-import"></i>
                            <span th:text="#{importacion.accion.procesar}"></span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header fw-semibold" th:text="#{importacion.formato.titulo}"></div>
                <div class="card-body">
                    <p class="mb-2" th:text="#{importacion.formato.herramienta}"></p>
                    <code class="d-block text-break mb-3">codigo,nombre,categoria,descripcion,ubicacion</code>

                    <p class="mb-2" th:text="#{importacion.formato.material}"></p>
                    <code class="d-block text-break">codigo,nombre,descripcion,unidad_medida,stock_actual,stock_minimo,valor_unitario,categoria,proveedor,ubicacion</code>
                </div>
            </div>

            <div th:if="${resultado != null}" class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{importacion.resultado.titulo}"></div>
                <div class="card-body">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <div class="border rounded p-3 h-100">
                                <div class="text-muted small" th:text="#{importacion.resultado.procesadas}"></div>
                                <div class="fs-4 fw-bold" th:text="${resultado.filasProcesadas}"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="border rounded p-3 h-100">
                                <div class="text-muted small" th:text="#{importacion.resultado.importadas}"></div>
                                <div class="fs-4 fw-bold" th:text="${resultado.filasImportadas}"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="border rounded p-3 h-100">
                                <div class="text-muted small" th:text="#{importacion.resultado.errores}"></div>
                                <div class="fs-4 fw-bold" th:text="${resultado.cantidadErrores}"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${!resultado.tieneErrores}"
                         class="alert alert-success mb-0"
                         th:text="#{importacion.resultado.exito}"></div>

                    <div th:if="${resultado.tieneErrores}" class="alert alert-warning mb-0">
                        <div class="fw-semibold mb-2" th:text="#{importacion.resultado.detalleErrores}"></div>
                        <ul class="mb-0">
                            <li th:each="error : ${resultado.errores}" th:text="${error}"></li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>

</body>
</html>
