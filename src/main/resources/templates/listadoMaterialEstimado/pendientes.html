<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body class="bg-light">
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container py-4">

    <h2 class="fw-bold mb-4">
        <i class="fa-solid fa-list-check text-primary me-2"></i>
        <span th:text="#{listadoMaterialEstimado.titulo.pendientes}">Listados pendientes de aprobacion</span>
    </h2>

    <div th:if="${exitoo}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i><span th:text="${exitoo}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/listado-material-estimado/pendientes}" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{rol.supervisor}">Supervisor</label>
                    <select name="supervisorId" class="form-select" onchange="this.form.submit()">
                        <option value="" th:text="#{rol.seleccionar}">-- Seleccione --</option>
                        <option th:each="s : ${supervisores}"
                                th:value="${s.idUsuario}"
                                th:text="${s.nombre + ' ' + s.apellido}"
                                th:selected="${supervisorId != null and supervisorId == s.idUsuario}">
                        </option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(pendientes)}" class="text-center py-5 text-muted">
                <i class="fa-solid fa-inbox fa-3x mb-3 d-block"></i>
                <span th:text="#{listadoMaterialEstimado.mensaje.sinPendientes}">No hay listados pendientes.</span>
            </div>
            <div class="table-responsive" th:if="${not #lists.isEmpty(pendientes)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th th:text="#{asignacion.proyecto}">Proyecto</th>
                        <th th:text="#{listadoMaterialEstimado.campo.fecha}">Fecha</th>
                        <th th:text="#{campo.acciones}">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${pendientes}">
                        <td th:text="${l.proyecto.nombre}"></td>
                        <td th:text="${#temporals.format(l.fechaCreacion, 'dd/MM/yyyy')}"></td>
                        <td>
                            <a th:href="@{/listado-material-estimado/consultar/{id}(id=${l.idListado},supervisorId=${supervisorId})}"
                               class="btn btn-sm btn-info" th:text="#{accion.consultar}">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>
