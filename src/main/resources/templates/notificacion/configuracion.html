<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2" th:text="#{notificacion.titulo}"></h1>
                    <p class="text-muted mb-4" th:text="#{notificacion.descripcion}"></p>

                    <div th:if="${todoOk}" class="alert alert-success" role="alert"
                         th:text="${todoOk}"></div>

                    <form th:action="@{/notificacion/guardar}"
                          th:object="${configuracion}"
                          method="post">

                        <input type="hidden" th:field="*{idConfiguracion}">

                        <div class="form-check form-switch border rounded p-3 ps-5 mb-3">
                            <input class="form-check-input"
                                   type="checkbox"
                                   role="switch"
                                   id="notificarStockMinimo"
                                   th:field="*{notificarStockMinimo}">
                            <label class="form-check-label fw-semibold"
                                   for="notificarStockMinimo"
                                   th:text="#{notificacion.stock.titulo}"></label>
                            <div class="small text-muted"
                                 th:text="#{notificacion.stock.descripcion}"></div>
                        </div>

                        <div class="form-check form-switch border rounded p-3 ps-5 mb-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   role="switch"
                                   id="notificarSolicitudesPendientes"
                                   th:field="*{notificarSolicitudesPendientes}">
                            <label class="form-check-label fw-semibold"
                                   for="notificarSolicitudesPendientes"
                                   th:text="#{notificacion.solicitud.titulo}"></label>
                            <div class="small text-muted"
                                 th:text="#{notificacion.solicitud.descripcion}"></div>
                        </div>

                        <div class="alert alert-info" role="alert">
                            <i class="fa-solid fa-envelope me-2"></i>
                            <span th:text="#{notificacion.correo.ayuda}"></span>
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <a th:href="@{/}" class="btn btn-outline-secondary"
                               th:text="#{accion.volver}"></a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk me-1"></i>
                                <span th:text="#{accion.guardar}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
<div th:replace="~{general/fragmentos :: scripts}"></div>

</body>
</html>
