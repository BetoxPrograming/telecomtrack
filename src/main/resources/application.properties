# Nombre de la aplicación
spring.application.name=telecomtrack

# Puerto donde escucha el servidor
server.port=80

# Formato de fecha y hora en el log
logging.pattern.dateformat=hh:mm

# Ocultar el banner de Spring
spring.main.banner-mode=off

# Evitar caché de Thymeleaf durante el desarrollo
spring.thymeleaf.cache=false

# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://db-tienda-web-patrones-tiendaproyectofidelitas.l.aivencloud.com:19804/telecomtrack?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=AVNS_frJCUE3g0bxsBBHobak

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar consultas SQL en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

# Configuración de Spring Mail
# Las credenciales sensibles se reciben mediante variables de entorno.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
